name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Firestore authorization on local emulator
        run: npx --yes firebase-tools@15.34.2 emulators:exec --only firestore --project demo-charisna-security --config firebase.test.json "node tests/firestore-rules.mjs"
      - run: npm run build
      - run: npm audit --audit-level=high
