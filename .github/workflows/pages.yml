name: Preview web Charisna
on:
  push:
    branches: [main]
    paths:
      - index.html
      - public/cloud-sync.js
      - public/roles.js
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp public/cloud-sync.js _site/cloud-sync.js
          cp public/roles.js _site/roles.js
          touch _site/.nojekyll
          if grep -Eq 'eyJhbGci|__initial_auth_token|data-bard-client-injected' _site/index.html; then
            echo 'Editor session token found in public page' >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
