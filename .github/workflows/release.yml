name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "CHARISNA KOST ${GITHUB_REF_NAME}" --generate-notes

  windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows installer and portable package
        run: npm run build:desktop:win
      - name: Verify Windows packages
        shell: pwsh
        run: |
          $packages = @(
            Get-ChildItem release -File -Filter *.exe |
              Where-Object { $_.Name -notlike '*.__uninstaller.exe' }
          )

          if ($packages.Count -lt 2) {
            Write-Host 'Isi folder release:'
            Get-ChildItem release -File | Format-Table Name, Length
            throw 'Installer NSIS dan portable EXE tidak ditemukan lengkap.'
          }

          $packages | Format-Table Name, Length
      - name: Upload Windows packages directly to Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Get-ChildItem release -File -Filter *.exe |
            Where-Object { $_.Name -notlike '*.__uninstaller.exe' } |
            ForEach-Object {
              gh release upload $env:GITHUB_REF_NAME $_.FullName --repo $env:GITHUB_REPOSITORY --clobber
              if ($LASTEXITCODE -ne 0) {
                throw "Gagal mengunggah $($_.Name) ke GitHub Release."
              }
            }

  android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web assets
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Synchronize Capacitor
        run: npx cap sync android
      - name: Build Android debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Management-Offline-${GITHUB_REF_NAME}-debug.apk"
      - name: Verify APK
        run: test -s "Management-Offline-${GITHUB_REF_NAME}-debug.apk"
      - name: Upload Android APK directly to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "Management-Offline-${GITHUB_REF_NAME}-debug.apk" --repo "$GITHUB_REPOSITORY" --clobber
